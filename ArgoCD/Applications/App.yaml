apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "commit-and-wait"
  annotations:
    argo.octopus.com/project: "waitforargoappstest"
    argo.octopus.com/environment: "development"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tleed5/OctopusVCSTest.git
    targetRevision: main
    path: ArgoCD/WaitForAppsResources
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  destination:
    server: https://kubernetes.default.svc
    namespace: waitforapps