apiVersion: apps/v1
kind: Deployment
metadata:
  name: "nginx-wait-for-apps-2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "nginx-wait-for-apps-2"
  template:
    metadata:
      labels:
        app: "nginx-wait-for-apps-2"
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.29.2
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"