apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s.%s" $.Values.config.namePrefix "helm.source" | quote }}
  namespace: argocd
  annotations:
    argo.octopus.com/project: "helmmanifestupdate"
    argo.octopus.com/environment: "development"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: {{ (printf "%s-%s" $.Values.config.namePrefix $.Release.Name) | quote }}
    server: {{ $.Values.config.destination | quote }}
  project: default
  sources:
    - repoURL: {{ $.Values.config.source.repoURL | quote }}
      targetRevision: {{ $.Values.config.source.targetRevision | quote }}
      path: ArgoCD/HelmSource/Chart
      helm:
        valueFiles:
          - values.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true