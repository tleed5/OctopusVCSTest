apiVersion: v1
kind: Secret
metadata:
  name: bitnami-oci
  namespace: argocd
  labels:
    # Tells Argo CD to treat this Secret as a repository definition.
    argocd.argoproj.io/secret-type: repository
stringData:
  # Must match the Application's spec.source.repoURL exactly (bare host[/path]).
  url: registry-1.docker.io/bitnamicharts
  type: helm
  # Required for OCI-backed Helm registries.
  enableOCI: "true"
  # Bitnami's public charts need no auth. For a private registry, add:
  # username: <user>
  # password: <token>
