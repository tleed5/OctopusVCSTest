apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "#{ApplicationName}-#{Octopus.Deployment.Tenant.Slug}"
  annotations:
    argo.octopus.com/project: "waitforargoappstest"
    argo.octopus.com/environment: "development"
    argo.octopus.com/tenant: "#{Octopus.Deployment.Tenant.Slug}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tleed5/OctopusVCSTest.git
    targetRevision: main
    path: ArgoCD/WaitForAppsResources
  syncPolicy:
    automated:
      prune: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
  destination:
    server: https://kubernetes.default.svc
    namespace: waitforapps